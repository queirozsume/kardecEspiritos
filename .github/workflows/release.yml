name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=livro\nstoreFile=../release-keystore.jks\n' \
            "$STORE_PASSWORD" "$STORE_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk livro-dos-espiritos-${{ github.ref_name }}.apk
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/livro-dos-espiritos-${{ github.ref_name }}.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "livro-dos-espiritos-${{ github.ref_name }}.apk" --title "${{ github.ref_name }}" --generate-notes
